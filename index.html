<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background: #111827;
            color: white;
            padding: 30px;
        }

        h1 {
            margin: 0;
            font-size: 40px;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            text-align: left;
        }
    </style>
</head>

<body>

    <header>
        <h1>StudyMate AI</h1>
        <p>Your AI Study Assistant</p>
    </header>

    <div class="container">

        <h2>Ask StudyMate</h2>

        <textarea id="question"
            placeholder="Enter your study question..."></textarea>

        <br>

        <button onclick="askQuestion()">Ask AI</button>

        <div id="result">
            Your answer will appear here.
        </div>

    </div>

    <script>
        function askQuestion() {
            const question = document.getElementById("question").value;

            if (question.trim() === "") {
                document.getElementById("result").innerText =
                    "Please enter a question.";
                return;
            }

            document.getElementById("result").innerText =
                "Your question was received! AI integration coming next.";
        }
    </script>

</body>
</html>
